[project]
name = "aws-remote-mcp-lambda"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mangum>=0.22,<1",
    "mcp>=2.1.1,<3",
    "pyjwt>=2.13,<3",
    "pydantic>=2.13,<3",
    "starlette>=1,<2",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = false
