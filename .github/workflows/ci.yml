name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Run lint
        run: uv run ruff check .

      - name: Run type checks
        run: uv run mypy

      - name: Compile source
        run: uv run python -m compileall -q src

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      - name: Validate SAM template
        run: sam validate --lint --region eu-west-1

      - name: Build Lambda artifact
        run: sam build --beta-features

      - name: Smoke test built Lambda artifact
        env:
          PYTHONPATH: .aws-sam/build/RemoteMcpFunction
        run: uv run python -c "from aws_remote_mcp.lambda_handler import handler; assert callable(handler)"

      - name: Run tests
        run: uv run pytest
