AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Safe closed-by-default AWS Remote MCP environment.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  OAuthIssuer:
    Type: String
    Description: Exact HTTPS JWT issuer advertised by the authorization server.
    AllowedPattern: "^https://[^?#]+$"
  OAuthAuthorizationServer:
    Type: String
    Description: Exact HTTPS OAuth authorization-server issuer used for MCP discovery.
    AllowedPattern: "^https://[^?#]+$"
  McpTokenAudience:
    Type: String
    Description: Exact audience required in access tokens for this MCP endpoint.
    AllowedPattern: "^https://[a-z0-9]+\\.execute-api\\.eu-west-1\\.amazonaws\\.com/mcp$"
  McpRequiredScope:
    Type: String
    Description: Exact OAuth scope required in addition to the resource audience.
    AllowedPattern: "^[A-Za-z0-9:/._-]+$"
  EnableExternalIntegrations:
    Type: String
    Default: "false"
    AllowedValues:
      - "false"
      - "true"
    Description: Create bounded confirmation state and expose confirmed writes.
  EnableCostExplorer:
    Type: String
    Default: "false"
    AllowedValues:
      - "false"
      - "true"
    Description: Grant one primary-billing-view cost read and expose its confirmed tool.
  IntegrationConfigParameterName:
    Type: String
    Default: /portfolio/aws-remote-mcp/dev/integrations
    AllowedPattern: "^/portfolio/aws-remote-mcp/(dev|prod)/[a-z0-9-]+$"
    Description: Exact Standard SecureString parameter containing integration config.
  ResourceExplorerViewArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:resource-explorer-2:eu-west-1:[0-9]{12}:view/[A-Za-z0-9_-]{1,64}/[A-Za-z0-9-]{1,64}$"
    Description: Optional exact ARN of a pre-existing Resource Explorer view in eu-west-1; empty disables Resource Explorer search.

Conditions:
  ExternalIntegrationsEnabled: !Equals [!Ref EnableExternalIntegrations, "true"]
  CostExplorerEnabled: !Equals [!Ref EnableCostExplorer, "true"]
  PersistentConfirmationEnabled: !Or
    - !Condition ExternalIntegrationsEnabled
    - !Condition CostExplorerEnabled
  ResourceExplorerViewConfigured: !Not [!Equals [!Ref ResourceExplorerViewArn, ""]]

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    MemorySize: 128
    Timeout: 10
    Tracing: Disabled
    Environment:
      Variables:
        APP_ENVIRONMENT: !Ref Environment

Resources:
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/apigateway/aws-remote-mcp-${Environment}"
      RetentionInDays: 7
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: project
          Value: aws-remote-mcp

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/aws-remote-mcp-${Environment}"
      RetentionInDays: 7
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: project
          Value: aws-remote-mcp

  RemoteMcpExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-log-streams
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${LambdaLogGroup.Arn}:*"
        - PolicyName: read-bounded-aws-inventory
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListLambdaFunctionsInDeploymentRegion
                Effect: Allow
                Action: lambda:ListFunctions
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: ListHttpApisInDeploymentRegion
                Effect: Allow
                Action: apigateway:GET
                Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis"
              - Sid: ListExactProjectStackResources
                Effect: Allow
                Action: cloudformation:ListStackResources
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:eu-west-1:${AWS::AccountId}:stack/aws-remote-mcp-dev/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:eu-west-1:${AWS::AccountId}:stack/aws-remote-mcp-prod/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:eu-west-1:${AWS::AccountId}:stack/aws-remote-mcp-auth-dev/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:eu-west-1:${AWS::AccountId}:stack/aws-remote-mcp-auth-prod/*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: eu-west-1
              - !If
                - ResourceExplorerViewConfigured
                - Sid: SearchOnlyConfiguredResourceExplorerView
                  Effect: Allow
                  Action: resource-explorer-2:Search
                  Resource: !Ref ResourceExplorerViewArn
                  Condition:
                    StringEquals:
                      aws:RequestedRegion: eu-west-1
                      resource-explorer-2:Operation: Search
                - !Ref AWS::NoValue
              - !If
                - CostExplorerEnabled
                - Sid: ReadPrimaryBillingViewCostAndUsage
                  Effect: Allow
                  Action: ce:GetCostAndUsage
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - PersistentConfirmationEnabled
                - Sid: PersistOnlyMcpConfirmations
                  Effect: Allow
                  Action:
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:GetItem
                  Resource: !GetAtt ConfirmationTable.Arn
                - !Ref AWS::NoValue
              - !If
                - ExternalIntegrationsEnabled
                - Sid: ReadOnlyExactIntegrationConfig
                  Effect: Allow
                  Action: ssm:GetParameter
                  Resource: !Sub >-
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${IntegrationConfigParameterName}
                - !Ref AWS::NoValue
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: project
          Value: aws-remote-mcp

  RemoteMcpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      DisableExecuteApiEndpoint: true
      FailOnWarnings: true
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: !Sub "aws-remote-mcp-${Environment}"
          description: Bounded read-only AWS inventory for one isolated environment.
          version: "1.0"
        servers:
          - url: "/"
        paths: {}
      Auth:
        Authorizers:
          OAuthJwtAuthorizer:
            AuthorizationScopes:
              - !Ref McpRequiredScope
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Ref OAuthIssuer
              audience:
                - !Ref McpTokenAudience
        DefaultAuthorizer: OAuthJwtAuthorizer
      DefaultRouteSettings:
        ThrottlingBurstLimit: 1
        ThrottlingRateLimit: 1
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: !Sub >-
          {"environment":"${Environment}","requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency"}
      Tags:
        environment: !Ref Environment
        project: aws-remote-mcp

  ConfirmationTable:
    Type: AWS::DynamoDB::Table
    Condition: PersistentConfirmationEnabled
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "aws-remote-mcp-confirmations-${Environment}"
      BillingMode: PAY_PER_REQUEST
      OnDemandThroughput:
        MaxReadRequestUnits: 1
        MaxWriteRequestUnits: 2
      AttributeDefinitions:
        - AttributeName: token_digest
          AttributeType: S
      KeySchema:
        - AttributeName: token_digest
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: project
          Value: aws-remote-mcp

  RemoteMcpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python-uv
    DependsOn:
      - LambdaLogGroup
    Properties:
      FunctionName: !Sub "aws-remote-mcp-${Environment}"
      Description: Bounded read-only AWS inventory over Streamable HTTP.
      CodeUri: src/
      Handler: aws_remote_mcp.lambda_handler.handler
      Role: !GetAtt RemoteMcpExecutionRole.Arn
      ReservedConcurrentExecutions: 0
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: INFO
      Environment:
        Variables:
          OAUTH_ISSUER: !Ref OAuthIssuer
          OAUTH_AUTHORIZATION_SERVER: !Ref OAuthAuthorizationServer
          MCP_RESOURCE_URL: !Ref McpTokenAudience
          MCP_REQUIRED_SCOPE: !Ref McpRequiredScope
          EXTERNAL_INTEGRATIONS_ENABLED: !Ref EnableExternalIntegrations
          COST_EXPLORER_ENABLED: !Ref EnableCostExplorer
          COST_EXPLORER_BILLING_VIEW_ARN: !If
            - CostExplorerEnabled
            - !Sub "arn:${AWS::Partition}:billing::${AWS::AccountId}:billingview/primary"
            - ""
          RESOURCE_EXPLORER_VIEW_ARN: !Ref ResourceExplorerViewArn
          CONFIRMATION_TABLE_NAME: !If
            - PersistentConfirmationEnabled
            - !Ref ConfirmationTable
            - ""
          INTEGRATION_CONFIG_PARAMETER: !If
            - ExternalIntegrationsEnabled
            - !Ref IntegrationConfigParameterName
            - ""
      Events:
        McpPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref RemoteMcpApi
            Method: POST
            Path: /mcp
            PayloadFormatVersion: "2.0"
            TimeoutInMillis: 10000
            Auth:
              Authorizer: OAuthJwtAuthorizer
              AuthorizationScopes:
                - !Ref McpRequiredScope
        ProtectedResourceMetadataGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref RemoteMcpApi
            Method: GET
            Path: /.well-known/oauth-protected-resource/mcp
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: NONE
        ProtectedResourceMetadataOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref RemoteMcpApi
            Method: OPTIONS
            Path: /.well-known/oauth-protected-resource/mcp
            PayloadFormatVersion: "2.0"
            Auth:
              Authorizer: NONE
      Tags:
        environment: !Ref Environment
        project: aws-remote-mcp

  SafetyShutdownLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/aws-remote-mcp-safety-shutdown-${Environment}"
      RetentionInDays: 7
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: project
          Value: aws-remote-mcp

  SafetyShutdownTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "aws-remote-mcp-safety-shutdown-${Environment}"
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: project
          Value: aws-remote-mcp

  SafetyShutdownTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SafetyShutdownTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOnlyTheTrafficAlarm
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SafetyShutdownTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:aws-remote-mcp-${Environment}-request-kill-switch"

  SafetyShutdownExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: close-only-this-environment-endpoint
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${SafetyShutdownLogGroup.Arn}:*"
              - Sid: DisableOnlyThisApi
                Effect: Allow
                Action: apigateway:PATCH
                Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${RemoteMcpApi}"
              - Sid: StopOnlyThisFunction
                Effect: Allow
                Action: lambda:PutFunctionConcurrency
                Resource: !GetAtt RemoteMcpFunction.Arn
              - Sid: DeleteOnlyThisTrafficAlarm
                Effect: Allow
                Action: cloudwatch:DeleteAlarms
                Resource: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:aws-remote-mcp-${Environment}-request-kill-switch"
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: project
          Value: aws-remote-mcp

  SafetyShutdownFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - SafetyShutdownLogGroup
    Properties:
      FunctionName: !Sub "aws-remote-mcp-safety-shutdown-${Environment}"
      Description: Fail-closed kill switch for a temporary validation window.
      CodeUri: safety_shutdown/
      Handler: handler.handler
      Role: !GetAtt SafetyShutdownExecutionRole.Arn
      Environment:
        Variables:
          TARGET_API_ID: !Ref RemoteMcpApi
          TARGET_FUNCTION_NAME: !Ref RemoteMcpFunction
          TRAFFIC_ALARM_NAME: !Sub "aws-remote-mcp-${Environment}-request-kill-switch"
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: INFO
        SystemLogLevel: INFO
      Events:
        TrafficAlarm:
          Type: SNS
          Properties:
            Topic: !Ref SafetyShutdownTopic
      Tags:
        environment: !Ref Environment
        project: aws-remote-mcp

  SafetyShutdownScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub "aws-remote-mcp-safety-${Environment}"
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: project
          Value: aws-remote-mcp

  SafetyShutdownSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !GetAtt SafetyShutdownScheduleGroup.Arn
      Policies:
        - PolicyName: invoke-only-safety-shutdown
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SafetyShutdownFunction.Arn
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: project
          Value: aws-remote-mcp

Outputs:
  McpEndpoint:
    Description: Closed-by-default MCP endpoint protected by an OAuth JWT.
    Value: !Sub "https://${RemoteMcpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mcp"
  ApiId:
    Description: HTTP API identifier for this environment.
    Value: !Ref RemoteMcpApi
  StageName:
    Description: Stage used by the stage-less execute-api endpoint URL.
    Value: "$default"
  FunctionName:
    Description: MCP Lambda function name for this environment.
    Value: !Ref RemoteMcpFunction
  DevMcpEndpoint:
    Description: Backward-compatible alias for McpEndpoint.
    Value: !Sub "https://${RemoteMcpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/mcp"
  ProtectedResourceMetadataEndpoint:
    Description: Public OAuth protected-resource metadata while the API is enabled.
    Value: !Sub "https://${RemoteMcpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/.well-known/oauth-protected-resource/mcp"
  DevApiId:
    Description: Backward-compatible alias for ApiId.
    Value: !Ref RemoteMcpApi
  DevStageName:
    Description: Backward-compatible alias for StageName.
    Value: "$default"
  DevFunctionName:
    Description: Backward-compatible alias for FunctionName.
    Value: !Ref RemoteMcpFunction
  SafetyShutdownFunctionArn:
    Description: Function invoked to close a temporary validation window.
    Value: !GetAtt SafetyShutdownFunction.Arn
  SafetyShutdownSchedulerRoleArn:
    Description: Exact role used by a one-time automatic close schedule.
    Value: !GetAtt SafetyShutdownSchedulerRole.Arn
  SafetyShutdownScheduleGroupName:
    Description: Dedicated group for one-time automatic close schedules.
    Value: !Ref SafetyShutdownScheduleGroup
  SafetyShutdownTopicArn:
    Description: Exact SNS topic used by the temporary request-volume alarm.
    Value: !Ref SafetyShutdownTopic
