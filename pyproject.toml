[project]
name = "aws-remote-mcp"
version = "0.1.0"
description = "Authenticated, cost-aware remote MCP server for AWS."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=2.1.1,<3",
    "starlette>=1,<2",
    "uvicorn>=0.52,<1",
]

[project.scripts]
aws-remote-mcp = "aws_remote_mcp.http_server:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
